name: Test, Build und Release

# Push/PR: nur schnelle Pruefungen (Tests, Clippy, Oberflaeche).
# Windows-Build und Release: nur manuell ueber Actions -> "Run workflow".
#   - Feld "version" leer: nur bauen, Ergebnis als Artefakt am Lauf.
#   - Feld "version" z.B. 2.0.0 oder 2.0.0-pre-release: bauen, Tag v<version> auf dem gewaehlten
#     Branch anlegen, Release als Entwurf erstellen, ZIP und Installer anhaengen, danach
#     veroeffentlichen (GitHub-Releases sind nach dem Veroeffentlichen unveraenderlich).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version fuer das Release (z.B. 2.0.0 oder 2.0.0-pre-release). Leer = nur bauen."
        required: false
        default: ""
      entwurf:
        description: "Release als Entwurf lassen (Beschreibung auf der Website ergaenzen und selbst veroeffentlichen)"
        type: boolean
        default: false

concurrency:
  # Release-Laeufe nicht durch einen spaeteren Push abbrechen
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: Kern testen (Linux)
    # PRs aus diesem Repository wurden schon beim Push geprueft -> nicht doppelt laufen
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Schriften fuer Tests
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Format pruefen
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p tz-core -p tz-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p tz-core -p tz-cli

  frontend:
    name: Oberflaeche pruefen
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows-Build (Installer + portable EXE)
    needs: [test, frontend]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Version pruefen (nur bei Release)
        if: inputs.version != ''
        shell: pwsh
        working-directory: .
        run: |
          # Muss eine gueltige SemVer-Version sein, der Tag darf noch nicht existieren
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$($env:VERSION)' ist keine gueltige Version (z.B. 2.0.0 oder 2.0.0-pre-release, ohne 'v')" }
          git ls-remote --exit-code --tags origin "refs/tags/v$($env:VERSION)" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$($env:VERSION) existiert bereits. Bitte eine neue Version waehlen." }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Version uebernehmen (nur bei Release)
        if: inputs.version != ''
        shell: pwsh
        working-directory: .
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"$', "version = `"$($env:VERSION)`"" | Set-Content Cargo.toml
          node -e "for (const f of ['app/package.json','app/src-tauri/tauri.conf.json']) { const fs=require('fs'); const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=process.argv[1]; fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n'); }" $env:VERSION
          Write-Host "Version gesetzt: $($env:VERSION)"
      - name: Tauri-Build
        run: npx tauri build
      - name: Portable-Paket zusammenstellen
        shell: pwsh
        run: |
          $ziel = "portable/TaktischeZeichenDruckgenerator"
          New-Item -ItemType Directory -Force -Path "$ziel/Taktische_Zeichen_Grafikvorlagen" | Out-Null
          New-Item -ItemType Directory -Force -Path "$ziel/fonts" | Out-Null
          Copy-Item ../target/release/TaktischeZeichenDruckgenerator.exe $ziel/
          Copy-Item ../README.md $ziel/LIESMICH.md
          Copy-Item ../LICENSE $ziel/LICENSE.txt
          Copy-Item src-tauri/LIZENZEN-DRITTANBIETER.txt $ziel/
          Compress-Archive -Path "portable/TaktischeZeichenDruckgenerator" -DestinationPath "portable/TaktischeZeichenDruckgenerator_portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TaktischeZeichenDruckgenerator-portable
          path: app/portable/TaktischeZeichenDruckgenerator/
      - uses: actions/upload-artifact@v4
        with:
          name: TaktischeZeichenDruckgenerator-installer
          path: target/release/bundle/nsis/*.exe
      - name: GitHub-Release erstellen (nur bei Release)
        if: inputs.version != ''
        shell: pwsh
        working-directory: .
        run: |
          $tag = "v$($env:VERSION)"
          $dateien = @("app/portable/TaktischeZeichenDruckgenerator_portable.zip") + (Get-ChildItem target/release/bundle/nsis/*.exe).FullName
          $optionen = @("--draft", "--target", "${{ github.sha }}", "--title", "Release $tag", "--generate-notes")
          # Versionen mit Bindestrich (z.B. 2.0.0-pre-release) sind Vorabversionen
          if ($env:VERSION.Contains("-")) { $optionen += "--prerelease" } else { $optionen += "--latest" }
          # Erst als Entwurf mit allen Dateien anlegen ...
          gh release create $tag @dateien @optionen
          if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
          # ... dann veroeffentlichen (dabei entsteht der Tag); als Entwurf belassen, wenn gewuenscht
          if ("${{ inputs.entwurf }}" -ne "true") {
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht veroeffentlicht werden" }
          }
          $anzahl = (gh release view $tag --json assets --jq ".assets | length")
          if ([int]$anzahl -lt $dateien.Count) { throw "Release $tag hat nur $anzahl von $($dateien.Count) Dateien" }
          Write-Host "Release $tag mit $anzahl Dateien erstellt"
