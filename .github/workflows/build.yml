name: Test, Build und Release

# Push/PR: nur schnelle Pruefungen (Tests, Clippy, Oberflaeche).
# Windows-Build: nur bei Tag "v*" (dann zusaetzlich GitHub-Release) oder manuell
# ("Run workflow" in GitHub Actions; Ergebnis als Artefakt am Lauf).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kern testen (Linux)
    # PRs aus diesem Repository wurden schon beim Push geprueft -> nicht doppelt laufen
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Schriften fuer Tests
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Format pruefen
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p tz-core -p tz-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p tz-core -p tz-cli

  frontend:
    name: Oberflaeche pruefen
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows-Build (Installer + portable EXE)
    needs: [test, frontend]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Version aus dem Tag uebernehmen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: .
        run: |
          # v2.0.0-pre-release -> 2.0.0-pre-release (muss eine gueltige SemVer-Version sein)
          $v = "${{ github.ref_name }}".Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$v' ist keine gueltige Version (z.B. v2.0.0 oder v2.0.0-pre-release)" }
          (Get-Content Cargo.toml) -replace '^version = ".*"$', "version = `"$v`"" | Set-Content Cargo.toml
          node -e "for (const f of ['app/package.json','app/src-tauri/tauri.conf.json']) { const fs=require('fs'); const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=process.argv[1]; fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n'); }" $v
          Write-Host "Version gesetzt: $v"
      - name: Tauri-Build
        run: npx tauri build
      - name: Portable-Paket zusammenstellen
        shell: pwsh
        run: |
          $ziel = "portable/TaktischeZeichenDruckgenerator"
          New-Item -ItemType Directory -Force -Path "$ziel/Taktische_Zeichen_Grafikvorlagen" | Out-Null
          New-Item -ItemType Directory -Force -Path "$ziel/fonts" | Out-Null
          Copy-Item ../target/release/TaktischeZeichenDruckgenerator.exe $ziel/
          Copy-Item ../README.md $ziel/LIESMICH.md
          Copy-Item ../LICENSE $ziel/LICENSE.txt
          Copy-Item src-tauri/LIZENZEN-DRITTANBIETER.txt $ziel/
          Compress-Archive -Path "portable/TaktischeZeichenDruckgenerator" -DestinationPath "portable/TaktischeZeichenDruckgenerator_portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TaktischeZeichenDruckgenerator-portable
          path: app/portable/TaktischeZeichenDruckgenerator/
      - uses: actions/upload-artifact@v4
        with:
          name: TaktischeZeichenDruckgenerator-installer
          path: target/release/bundle/nsis/*.exe
      - name: GitHub-Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          # Tags mit Bindestrich (z.B. v2.0.0-pre-release) werden als Vorabversion veroeffentlicht
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          artifacts: "app/portable/TaktischeZeichenDruckgenerator_portable.zip,target/release/bundle/nsis/*.exe"
          allowUpdates: true
          # Wurde das Release auf der GitHub-Website angelegt: Titel und Beschreibung dort beibehalten
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
