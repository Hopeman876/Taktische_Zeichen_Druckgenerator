[workspace]
resolver = "2"
members = ["crates/tz-core", "crates/tz-cli", "app/src-tauri"]
# Die Tauri-App braucht WebView-Bibliotheken des Betriebssystems. Damit
# `cargo test` ueberall laeuft, baut der Standard-Aufruf nur Kern + CLI.
default-members = ["crates/tz-core", "crates/tz-cli", "app/src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ramon Hoffmann"]

[workspace.dependencies]
tz-core = { path = "crates/tz-core" }
# svg2pdf 0.13 ist an usvg/resvg 0.45 gebunden - Versionen gemeinsam anheben!
svg2pdf = "0.13"
usvg = "0.45"
resvg = "0.45"
pdf-writer = "0.12"
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
